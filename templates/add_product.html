<!DOCTYPE html>
<html>
<head>
    <title>Admin - Add Product</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="padding: 50px; background: #121212; color: white;">
    <h2>Add New Item to Inventory</h2>
    <form method="POST" enctype="multipart/form-data">
        <input type="text" name="name" placeholder="Product Name" required><br><br>
        <input type="text" name="category" placeholder="Category (e.g. Kitchen)"><br><br>
        <input type="text" name="price" placeholder="Price (e.g. KSh 5,000)"><br><br>
        <textarea name="description" placeholder="Description"></textarea><br><br>
        <label>Upload Product Image:</label><br>
        <input type="file" name="image" required><br><br>
        <button type="submit" class="buy-btn">Upload to Store</button>
    </form>
</body>
</html>
